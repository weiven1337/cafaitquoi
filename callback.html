<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autorisation</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>Autorisation reçue</h1>
<p>Code à coller dans l'outil de stats (valable quelques minutes) :</p>
<pre id="code" style="white-space:pre-wrap;word-break:break-all;background:#161b22;padding:12px;border-radius:8px"></pre>
<p>Tu peux ensuite fermer cet onglet.</p>
<script>
var q = new URLSearchParams(location.search);
document.getElementById('code').textContent = q.get('code') || q.get('error_description') || q.get('error') || '(aucun code)';
</script>
</main></body></html>
